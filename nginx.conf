server {
    listen 80;
    server_name ingenero360.ai www.ingenero360.ai;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ingenero360.ai www.ingenero360.ai;

    # SSL Certificates (managed by Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ingenero360.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ingenero360.ai/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum upload size for brochure files (100MB)
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/pdf;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer & Timeout settings for large PDF downloads
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Static file caching
    location /static/ {
        proxy_pass http://127.0.0.1:5000/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
